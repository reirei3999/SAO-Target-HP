name: Build MOD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sao-target-hp-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: リリース用JARを選別
        if: startsWith(github.ref, 'refs/tags/')
        run: rm -f build/libs/*-dev.jar build/libs/*-sources.jar

      - name: GitHub Releasesへ完成版を添付
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Minecraft 1.21.1 / Fabric 用のリリースです。

            導入するファイルは `sao-target-hp-${{ github.ref_name }}.jar` です。`-dev.jar` は導入しないでください。
          files: build/libs/sao-target-hp-*.jar
